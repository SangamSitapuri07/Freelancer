[package]
name = "ghost_ai"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
image = "0.24"
screenshots = "0.8"
enigo = "0.2.0"
rand = "0.8"
machine-uid = "0.3"
lazy_static = "1.4"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader"
] }

[build-dependencies]
winres = "0.1"